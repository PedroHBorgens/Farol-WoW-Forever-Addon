name: Tests

# Roda os testes a cada push e pull request, e gera o pacote do addon pronto para instalar.
# Runs the tests on every push and pull request, and builds an install-ready add-on package.
on:
  push:
  pull_request:
  workflow_dispatch:

# Segurança: só leitura; as ações são fixadas pelo SHA do commit (o Dependabot as atualiza).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (fixado pelo SHA)
        with:
          persist-credentials: false

      - name: Install Lua 5.1 (same version as the WoW client)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Run tests
        run: lua5.1 tests/run.lua

      - name: Read add-on version
        id: version
        run: |
          version=$(grep -m1 '^## Version:' Farol/Farol_Mainline.toc | sed 's/## Version: //' | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package (only the Farol folder)
        run: |
          mkdir -p dist
          cp -r Farol dist/Farol
          cp LICENSE dist/Farol/LICENSE.txt

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (fixado pelo SHA)
        with:
          name: Farol-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 30
